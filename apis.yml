name: Lumity
description: 'Lumity is a digital employee benefits broker (part of Alera Group) that acts as an extension
  of HR teams, combining benefits-administration technology with dedicated benefits experts. Its platform
  centralizes plan management, eligibility, employee enrollment (web and mobile), renewal strategy and
  negotiation, year-round employee support, PEO migration, and reporting/analytics with cost forecasting.
  Lumity markets outcomes such as average cost savings through smarter plan selection and per-employee
  annual savings. It surfaced in the API Evangelist network as a portfolio company of Threshold Ventures
  (fintech). Enrichment found no first-party public API, developer portal, or specifications: the employer
  login portal (er-portal.lumity.com) redirects to the third-party PlanYear platform, and legal pages are
  served under Alera Group.'
